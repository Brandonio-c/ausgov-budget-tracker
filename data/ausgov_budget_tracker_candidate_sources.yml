  - xlsx
  access_method: direct_file
  automation: high
  update_frequency: annual
  time_coverage: historical series through 2024-25
  measure_types:
  - actual_accrual_expense
  - revenue
  - assets
  - liabilities
  - fiscal_balance
  accounting_basis:
  - gfs
  granularity:
  - level of government
  - sector
  - economic type
  - function where published
  parser_strategy: Download ZIP, hash every workbook, parse table number and series headers, retain ABS series labels and
    footnotes.
  caveats:
  - Best comparable national baseline, but not an entity, program, contract or invoice ledger.
  - Intergovernmental transfers mean levels must not be naively summed.
