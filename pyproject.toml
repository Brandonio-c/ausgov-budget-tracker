[project]
name = "ausgov-budget-tracker"
version = "0.2.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "full_data: tests that require production data/facts.db or raw downloads",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/frontend", "data", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src/backend", "scripts/ingest"]
exclude = ["src/frontend"]
