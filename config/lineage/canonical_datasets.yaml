# Explicit raw source → canonical dataset lineage (ingestion coverage).
# coverage_status values:
#   fully_ingested | partially_ingested | duplicate_alias | reference_only |
#   no_useful_fiscal_data | officially_unavailable | adapter_failed |
#   quarantined | not_acquired

version: 1

datasets:
  - canonical_dataset_id: abs_gfs_table4_expenses
    fact_source_keys: [abs_gfs_commonwealth_130]
    raw_source_id_prefixes: [abs_gfs_]
    extractor_name: adapters/abs_gfs.py
    coverage_status: fully_ingested
    notes: Jurisdiction Table_4 melts share one adapter; raw IDs map via abs_gfs_* sources.

  - canonical_dataset_id: abs_gfs_table1_revenue
    fact_source_keys: [abs_gfs_commonwealth_130]  # revenue sheets same workbook family
    raw_source_id_prefixes: [abs_gfs_]
    extractor_name: m4_gfs_revenue.py
    coverage_status: partially_ingested
    notes: Revenue mode uses gfs_revenue; detailed tax is separate dataset below.

  - canonical_dataset_id: abs_taxation_revenue_detail
    fact_source_keys: []
    raw_source_id_prefixes: [abs_taxation]
    extractor_name: m_gdp_tax.py
    coverage_status: partially_ingested
    notes: Must attach as related detail under GFS Taxation revenue — not additive duplicate.

  - canonical_dataset_id: federal_pbs_programs
    fact_source_keys:
      - federal_pbs_programs_all
      - federal_dss_pbs_programs
      - federal_health_pbs_programs
      - federal_pbs_programs_s6_bridge
    raw_source_id_prefixes: [federal_pbs_, federal_transparency_portal]
    extractor_name: extractors/pbs_programs_all.py
    coverage_status: partially_ingested
    notes: Header-aware year resolution; quarantined rows excluded.

  - canonical_dataset_id: federal_statement_6
    fact_source_keys:
      - federal_budget_statement_6_a61
      - federal_budget_statement_6_components
    raw_source_id_prefixes: [federal_budget_statement_6]
    extractor_name: breakdown_pack.py
    coverage_status: partially_ingested

  - canonical_dataset_id: federal_fbo_appendix_a
    fact_source_keys: [federal_fbo_2024_25_function_subfunction]
    raw_source_id_prefixes: [federal_fbo_]
    extractor_name: extractors/fbo_appendix_a.py
    coverage_status: fully_ingested

  - canonical_dataset_id: state_borrowing_authorities
    fact_source_keys: []
    raw_source_id_prefixes: [nsw_tcorp, vic_tcv, qld_qtc, sa_safa, wa_wutc, tas_tascorp, act_, nt_]
    extractor_name: m_borrowing_authorities.py
    coverage_status: partially_ingested
    notes: Mixed face/fair value — API disables unqualified totals when mixed.

aliases:
  federal_ggs_function: federal_budget_statement_6_a61
  abs_gfs_national: abs_gfs_commonwealth_130
