    evidence: portfolio_ownership
    status: mapped

  # Genuinely ambiguous, cross-function portfolios: deliberately NOT
  # assigned a default. Every fact in these portfolios stays unmapped
  # unless a program_label_override below applies - required test case for
  # "ambiguous mappings must remain unmapped and be reported".
  - pbs_portfolio: "Attorney-General's"
    status: ambiguous
    confidence: low
    evidence: portfolio_ownership
    reason: >
      Portfolio spans courts and legal services, emergency management,
      human rights, and integrity/security functions with no single
      dominant Statement 6 function and no program-level evidence
      established in this pass to split them reliably.

  - pbs_portfolio: "Infrastructure Transport Regional Development Communications Sport and the Arts"
    status: ambiguous
    confidence: low
    evidence: portfolio_ownership
    reason: >
      Portfolio name itself spans at least three distinct Statement 6
      functions (Transport and communication; Recreation and culture for
      sport/arts; Housing and community amenities for regional
      development) with no single dominant destination and no
      program-level evidence established in this pass to split them
      reliably.

