# Crosswalk: federal_pbs_programs_all program facts -> Statement 6 function/
# subfunction hierarchy, as related_breakdown (non-additive) navigation.
#
# Evidence tiers (checked in this order for every PBS fact):
#   1. explicit_existing_mapping  - an identifier already correct elsewhere
#      (not used in this file; none of the 63 PBS documents carry an
#      explicit Statement 6 identifier of their own).
#   2. portfolio_ownership        - the PBS portfolio's well-documented,
#      stable government-structure ownership of a Statement 6 function.
#      See `portfolio_defaults` below.
#   3. published_classification   - not used in this file (Statement 6 does
#      not publish a portfolio->function crosswalk directly; PBS documents
#      do not cite their own COFOG/S6 function).
#   4. exact_label_with_portfolio_context - an exact (not fuzzy/regex),
#      case-insensitive substring in the PBS program_label, corroborated by
#      which portfolio it appears in, matching a specific existing Statement
#      6 subfunction/component node exactly. See `program_label_overrides`.
#   5. manual_review              - not used in this pass; anything not
#      resolved by 2 or 4 is left unmapped and reported, not guessed.
#
# `program_label_overrides` are checked before `portfolio_defaults` for a
# given fact; if neither matches, or the matching portfolio_defaults entry
# has status: ambiguous, the fact is left unmapped and reported with a
# reason - never silently defaulted to "General public services" or similar.
#
# All statement6_function / statement6_subfunction / statement6_component
# values below were verified to exist as real nodes under
# federal_budget_statement_6_* source_documents before being written here
# (queried directly against data/facts.db, not assumed).

id: pbs_programs_all_under_s6
version: 1
crosswalk_id: pbs_programs_all_under_s6
edge_kind: related_breakdown

portfolio_defaults:
  - pbs_portfolio: "Social Services"
    statement6_function: "Social security and welfare"
    confidence: high
    evidence: portfolio_ownership
    status: mapped
    notes: >
      DSS's entire portfolio remit is social security and welfare payments
      and services; function-level default. Subfunction-level routing for
      specific programs (aged, disability, families, unemployed) is via
      program_label_overrides below where the label gives an exact,
      corroborated match to a real S6 subfunction.

  - pbs_portfolio: "Health Disability and Ageing"
    statement6_function: "Health"
    confidence: high
    evidence: portfolio_ownership
    status: mapped
    notes: >
      Function-level default only. NDIA/NDIS programs administered within
      this portfolio are routed to Social security and welfare via
      program_label_overrides (NDIA is legally the National Disability
      Insurance Agency, an executive agency inside this portfolio, but its
      Statement 6 classification is Social security and welfare, not
      Health - confirmed against real S6 node names).

  - pbs_portfolio: "Defence"
    statement6_function: "Defence"
    confidence: high
    evidence: portfolio_ownership
    status: mapped
    notes: >
      Statement 6 carries no Defence subfunction breakdown (verified: zero
      "Defence / ..." nodes exist) - function-level attach only.

  - pbs_portfolio: "Education"
    statement6_function: "Education"
    confidence: high
    evidence: portfolio_ownership
    status: mapped

  - pbs_portfolio: "Veterans' Affairs"
