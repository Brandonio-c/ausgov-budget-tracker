    statement6_subfunction: "Social security and welfare / Assistance to veterans and dependants"
    confidence: medium
    evidence: portfolio_ownership
    status: mapped
    notes: >
      Default only for programs not caught by a health-related label
      override below. DVA also runs veterans' health/pharmaceutical
      programs (Statement 6 classifies these under Health), routed via
      program_label_overrides - not this default.

  - pbs_portfolio: "Agriculture Fisheries and Forestry"
