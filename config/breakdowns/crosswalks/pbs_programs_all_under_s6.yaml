    status: mapped
    notes: >
      Portfolio also covers environment/water programs that arguably
      belong under Housing and community amenities in Statement 6's
      classification; only the dominant energy component is mapped here
      with confidence: low. Not upgraded to high without program-level
      evidence.

  - pbs_portfolio: "Prime Minister and Cabinet"
