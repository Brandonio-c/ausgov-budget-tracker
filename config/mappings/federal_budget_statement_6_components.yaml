source_id: federal_budget_statement_6_components
title: BP1 Statement 6 component tables (SSW)
publisher: Commonwealth of Australia
jurisdiction: Commonwealth
government_level: federal
source_family: budget
measure_type: budget_estimate
accounting_basis: accrual
estimate_status: budget
period_granularity: financial_year
# fact_key includes node_name, which legitimately changes as the
# extractor's Table 6.8.x scoping logic is fixed (e.g. Health's
# "Medical services and benefits" / "Pharmaceutical benefits and
# services" were previously cross-contaminated with each other's
# components - 8 stale facts, ~$68B combined, found live via the Federal
# deep-data mission's Health depth audit). Without this flag a fixed
# extraction run never overwrites its predecessor's now-wrong rows, just
# silently accumulates them alongside the corrected ones.
replace_on_reload: true
input:
  path: data/staging/breakdowns/bp1_s6_components.csv
  format: csv
columns:
  financial_year: fy
  amount_aud: amount
  node_name: category
  estimate_status: estimate_status
  locator: locator
  landing_url: landing_url
  original_resource_url: resource_url
attribution:
  landing_url_column: landing_url
  original_resource_url_column: resource_url
  cached_copy_path: data/raw/federal/federal_budget_statement_6_2026_27/snapshots/20260720T215815Z/files/bp1_bs-6.pdf
fact_key_template: '{source_id}|{financial_year}|{node_name}|{measure_type}|{estimate_status}'
