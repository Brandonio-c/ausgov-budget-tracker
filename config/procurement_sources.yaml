manifest_version: 1
researched_at: '2026-07-24'
purpose: Candidate official sources for deeper Australian federal, state and local
  budget/spending lineage.
not_drop_in_note: Unified registry (M11). Includes Phase 1 website sources (phase1_*
  fields) and procurement acquisition sources. Use scripts/fetch_orchestrator.py as
  the single entry point.
traceability_tiers:
  1: whole-of-government or jurisdiction aggregate
  2: function/subfunction or state service aggregate
  3: portfolio/entity/outcome/program/component/appropriation
  4: grant award, contract or aggregated payment
  5: published invoice-level payment above a disclosure threshold
measure_separation_rule: Never sum budget estimates, appropriations, accrual expenses,
  cash payments, contract values, grant awards, counts or forecasts unless an explicit
  reconciliation defines the bridge.
