      Cash collections received from Queensland Government departments
      into the Consolidated Fund, cumulative from 1 July to the
      reporting quarter end.
    flow_or_stock: flow
    period_granularity: year_to_date
    period_start: financial_year_start
    period_end: quarter_end
    estimate_status: actual
    accounting_basis: cash
    unit: AUD
    sign_convention: positive
    compatibility_group: qld_cffr_quarterly_ytd_collections_from_departments
    allowed_comparisons:
