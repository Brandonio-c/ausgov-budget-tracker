      - any other qld_cffr_quarterly_ytd_* receipt/payment measure for the same edition, plotted as a distinct series (never summed by the API)
    forbidden_comparisons:
      - any accrual-basis GFS/PBS/MFS revenue measure
      - qld_cffr_collections_from_departments (the annual full-year figure - a different vintage)
    dashboard_treatment: dedicated QLD CFFR Quarterly timeline/comparison API only
