# ---------------------------------------------------------------------------
# Quarantine rules (applied by the Task 5 loader, in addition to the
# per-measure gates above)
# ---------------------------------------------------------------------------
quarantine_rules:
  - id: unrecognized_label
    text: A row label (after stripping trailing footnote markers and normalizing whitespace) that matches no measure's source_label_variants is quarantined, not guessed.
  - id: unrecognized_column_header
    text: A column header that does not match the extractor's HEADER_RE shape (status/financial_year/optional-YTD/month/unit) is quarantined.
  - id: ambiguous_bare_month
    text: A bare (non-YTD-prefixed) month header other than July is quarantined.
  - id: undetermined_unit
    text: A column header whose unit token is not $m or $b is quarantined.
  - id: missing_source_cell
    text: A row/column intersection with no locatable source cell reference is quarantined (never loaded without a citation).
  - id: title_and_footnote_rows_excluded
    text: Row 0 (title) and any row whose label starts with "(<letter>)" (the footnote-explanation paragraph) are structural, not data, and are excluded before quarantine/publish classification even applies.
