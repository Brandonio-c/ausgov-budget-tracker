version: 1

global_rules:
  - id: only_the_confirmed_tractable_nine_year_slice_is_loaded
    text: >
      Only FY2010-11 through FY2018-19 are loaded - three individually-
      verified column layouts, never assumed uniform (see
      ops/reports/fbo-appendix-a-page-anchor-scoping-20260818T160000Z.md
      and ops/reports/data-remediation-progress.md's item 8.1 milestone
      entries): FY2010-11/FY2011-12 has a 3-numeric-column layout
      (prior-year Outcome | current-year Estimate at Outcome | next-year
      Budget); FY2012-13 through FY2016-17 adds a 4th "Change on Budget"
      column, Estimate at Outcome still in position 2 (FY2014-15..
      FY2016-17 were originally excluded on a "different header
      wording" finding that a later direct re-check found was stale -
      they use the identical layout as FY2012-13/FY2013-14);
      FY2017-18/FY2018-19 use a genuinely different 5-column layout
      where Estimate at Outcome moves to position 4 (prior-year Outcome
      | current-year Budget | next-year Budget | current-year Estimate
      at Outcome | Change on Budget) - confirmed by direct page
      inspection and an exact match on both cross-checks for both
      years, since blindly reusing position 2 there would have silently
      loaded a Budget forecast as an actual. The entire pre-2010-11
      population still needs its own dedicated investigation before
      being added here.
  - id: function_level_totals_only_never_sub_function_detail
    text: >
      Only the 13 COFOG-style function totals plus the 5 "Other purposes"
      line items, "Total other purposes", and "Total expenses" are
      loaded - never the individual sub-function line items beneath each
      function (a much larger, higher-drift-risk surface not attempted
      this pass), matching the granularity already chosen for the MFS
      Note 3 workbook.
  - id: estimate_at_outcome_column_only
    text: >
      Only the middle "<FY> Estimate at Outcome" numeric column is
      extracted for each row - never the leading prior-year-outcome
      comparative (independently extracted from that prior year's own
      edition) or the trailing next-year Budget forecast column (a
      forecast, never an actual).
  - id: never_conflated_with_gfs_pbs_mfs
    text: >
      This is the FBO's own Appendix A function series - a different
      source/table from the already-loaded GFS/PBS/MFS families, and
      never compared, summed, or substituted for any of them even where
      a function name looks similar.

measures:
# ---------------------------------------------------------------------------
# Pre-2019 Final Budget Outcome (FBO) Appendix A: Expenses by Function and
# Sub-function - item 8.1's first slice (FY2010-11, FY2011-12 only - the
# confirmed-tractable 3-numeric-column sub-generation; FY2012-13/FY2013-14
# add a 4th column and are deliberately excluded this pass). Verified directly
# against both real editions before writing any label mapping - see
# scripts/ingest/extractors/fbo_appendix_a_function.py's module docstring and
# ops/reports/fbo-appendix-a-page-anchor-scoping-20260818T160000Z.md.
#
# Function-level totals only (13 COFOG-style functions + 5 Other purposes
# line items + Total other purposes + Total expenses = 20 measures) -
# deliberately NOT the individual sub-function line items beneath each
# function, matching the same granularity choice already made for the MFS
# Note 3 workbook (item 7.1).
# ---------------------------------------------------------------------------
  fbo_appendix_a_general_public_services:
    economic_meaning: >
      Australian Government general government sector expenses for the
      General public services, an actual (Final Budget Outcome "Estimate at Outcome")
      figure for the financial year.
    flow_or_stock: flow
    period_granularity: financial_year
    period_start: financial_year_start
    period_end: financial_year_end
    estimate_status: actual
    accounting_basis: accrual
    unit: AUD
    sign_convention: signed
    compatibility_group: fbo_appendix_a_general_public_services
    allowed_comparisons:
      - fbo_appendix_a_general_public_services at a compatible reporting date, a different financial_year
      - any other fbo_appendix_a_* measure for the same financial_year, plotted as a distinct series (never summed by the API unless explicitly noted as a source-stated total relationship)
    forbidden_comparisons:
      - any annual GFS/PBS/MFS compatibility_group fact (this is the FBO's own Appendix A function series, a different source/table from the already-loaded GFS/PBS/MFS families)
    dashboard_treatment: dedicated FBO Appendix A timeline/comparison API only
    source_label_variants: ["General public services"]
    root_total_allowed: 1

