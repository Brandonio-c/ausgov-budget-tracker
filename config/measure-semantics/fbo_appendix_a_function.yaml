version: 1

global_rules:
  - id: only_the_confirmed_tractable_twenty_year_slice_is_loaded
    text: >
      Only FY1999-00 through FY2018-19 are loaded - FY1998-99 is
      permanently excluded, not a gap to fill later: it predates
      accrual/functional expense reporting entirely and has no such
      table at all (confirmed via its own full table of contents). Four
      individually-verified column layouts are covered, never assumed
      uniform (see
      ops/reports/fbo-appendix-a-page-anchor-scoping-20260818T160000Z.md,
      ops/reports/fbo-pre-2010-scoping-20260819T182500Z.md, and
      ops/reports/data-remediation-progress.md's item 8.1 milestone
      entries): FY1999-00/FY2000-01 has a 2-numeric-column layout
      (next-year Budget | current-year Estimate at Outcome, no prior-
      year comparative at all); FY2001-02 through FY2011-12 has a
      3-numeric-column layout, but Estimate at Outcome sits in column 3
      for FY2001-02/FY2002-03/FY2003-04 (prior-year Outcome | next-year
      Budget | current-year Estimate at Outcome) and moves back to
      column 2 for FY2004-05 onward (prior-year Outcome | current-year
      Estimate at Outcome | next-year Budget) - the same column-order
      trap already caught once for FY2017-19, each year individually
      verified, never inferred from a neighbour; FY2012-13 through
      FY2016-17 adds a 4th "Change on Budget" column, Estimate at
      Outcome still in position 2; FY2017-18/FY2018-19 use a 5-column
      layout where Estimate at Outcome moves to position 4. FY1999-00,
      FY2001-02, and FY2002-03 additionally require a pre-processing
      decode step (see fbo_appendix_a_function.py's `_decode_shift29` -
      pypdf cannot read these 3 files' embedded font at all; `pdftotext`
      recovers it with a consistent +29 ASCII-code shift, verified
      against multiple independently-decoded words). FY2004-05/
      FY2005-06/FY2006-07 title the table "Appendix B"/"Table B1" (the
      anchor regex accepts either letter, and a 2nd alternative catches
      FY2000-01's continuation pages which omit the "Appendix B:" line
      entirely); FY2007-08 onward use "Appendix A"/"Table A1". Building
      this population required fixing several real, evidence-confirmed
      label/number defects, each re-verified to change 0 values across
      every already-loaded year before being applied: a stray space
      inserted inside a large number (e.g. "5, 926" for "5,926");
      footnote markers in 2 different real forms - directly attached
      with no space ("Defence(a)") and a bare letter with a space and no
      parentheses ("Total health a") - both generalized into a single
      shared optional-suffix pattern; label case variation ("Total
      Transport and Communication" title-cased), generalized into
      case-insensitive matching; an ampersand variant of one label
      ("Mining, manufacturing & construction"); and a genuine word-
      reordering of another ("Total agriculture, fisheries and
      forestry" in FY1999-00, the same concept as "Total agriculture,
      forestry and fishing" elsewhere, added as an accepted alternative).
      Three genuine, confirmed-real absences remain deliberately
      unmatched rather than force-fit: `mining_manufacturing_construction`
      is not loaded for FY1999-00 through FY2002-03, whose editions
      scope this function narrower ("...other than fuels") - a real
      scope difference, not a label variant; `nominal_superannuation_interest`
      is not loaded for FY1999-00, whose "Other purposes" section has no
      such line item at all; and FY2000-01/FY2001-02 have a genuine 6th
      "Other purposes" line item ("Asset sales", $31m/$64m respectively,
      confirmed present by direct inspection and fully explaining what
      would otherwise look like an unexplained cross-check gap) that
      this workbook deliberately does not model as its own measure - it
      was phased out by FY2002-03 (confirmed absent there) and never
      appears in any other loaded year, so the 5-addend `total_other_purposes`
      cross-check legitimately does not reconcile for exactly these 2
      years, by design, not by extraction error.
  - id: function_level_totals_only_never_sub_function_detail
    text: >
      Only the 13 COFOG-style function totals plus the 5 "Other purposes"
      line items, "Total other purposes", and "Total expenses" are
      loaded - never the individual sub-function line items beneath each
      function (a much larger, higher-drift-risk surface not attempted
      this pass), matching the granularity already chosen for the MFS
      Note 3 workbook.
  - id: estimate_at_outcome_column_only
    text: >
      Only the middle "<FY> Estimate at Outcome" numeric column is
      extracted for each row - never the leading prior-year-outcome
      comparative (independently extracted from that prior year's own
      edition) or the trailing next-year Budget forecast column (a
      forecast, never an actual).
  - id: never_conflated_with_gfs_pbs_mfs
    text: >
      This is the FBO's own Appendix A function series - a different
      source/table from the already-loaded GFS/PBS/MFS families, and
      never compared, summed, or substituted for any of them even where
      a function name looks similar.

measures:
# ---------------------------------------------------------------------------
# Pre-2019 Final Budget Outcome (FBO) Appendix A: Expenses by Function and
# Sub-function - item 8.1's first slice (FY2010-11, FY2011-12 only - the
# confirmed-tractable 3-numeric-column sub-generation; FY2012-13/FY2013-14
# add a 4th column and are deliberately excluded this pass). Verified directly
# against both real editions before writing any label mapping - see
# scripts/ingest/extractors/fbo_appendix_a_function.py's module docstring and
# ops/reports/fbo-appendix-a-page-anchor-scoping-20260818T160000Z.md.
#
# Function-level totals only (13 COFOG-style functions + 5 Other purposes
# line items + Total other purposes + Total expenses = 20 measures) -
# deliberately NOT the individual sub-function line items beneath each
# function, matching the same granularity choice already made for the MFS
# Note 3 workbook (item 7.1).
# ---------------------------------------------------------------------------
  fbo_appendix_a_general_public_services:
    economic_meaning: >
      Australian Government general government sector expenses for the
      General public services, an actual (Final Budget Outcome "Estimate at Outcome")
      figure for the financial year.
    flow_or_stock: flow
    period_granularity: financial_year
    period_start: financial_year_start
    period_end: financial_year_end
    estimate_status: actual
    accounting_basis: accrual
    unit: AUD
    sign_convention: signed
    compatibility_group: fbo_appendix_a_general_public_services
    allowed_comparisons:
      - fbo_appendix_a_general_public_services at a compatible reporting date, a different financial_year
      - any other fbo_appendix_a_* measure for the same financial_year, plotted as a distinct series (never summed by the API unless explicitly noted as a source-stated total relationship)
    forbidden_comparisons:
      - any annual GFS/PBS/MFS compatibility_group fact (this is the FBO's own Appendix A function series, a different source/table from the already-loaded GFS/PBS/MFS families)
    dashboard_treatment: dedicated FBO Appendix A timeline/comparison API only
    source_label_variants: ["General public services"]
    root_total_allowed: 1

